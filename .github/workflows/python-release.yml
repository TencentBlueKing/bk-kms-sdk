name: Publish Python SDK to PyPI

on:
  push:
    tags:
      - "python/v*"

permissions:
  contents: read

concurrency:
  group: python-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import runpy

          version = runpy.run_path("src/bk_kms/_version.py")["__version__"]
          expected_tag = f"python/v{version}"
          tag = os.environ["RELEASE_TAG"]
          if tag != expected_tag:
              raise SystemExit(f"Tag {tag!r} does not match package version; expected {expected_tag!r}")
          PY
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,gm]"
      - run: make lint
      - run: make test
      - run: make build
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: python/dist/*
          if-no-files-found: error

  publish:
    if: github.repository == 'TencentBlueKing/bk-kms-sdk'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bk-kms-sdk
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
