name: Python SDK

on:
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python.yml"
      - ".github/workflows/python-release.yml"
  push:
    paths:
      - "python/**"
      - ".github/workflows/python.yml"
      - ".github/workflows/python-release.yml"

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,gm]"
      - run: make lint
      - run: make test
      - run: make build

  tencentos:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            image: tencentos/tencentos4-minimal@sha256:bf28f69eb15a999b701cf771d9681e50abd24ee20952738a1b8908fe34cd89be
          - platform: linux/arm64
            image: tencentos/tencentos4-minimal@sha256:e2ba6d4f8814fd7b9a13131c280e139cea259a8fda372b1223514de452ad601d
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Test in TencentOS 4
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -v "${PWD}:/workspace" \
            -w /workspace \
            "${{ matrix.image }}" \
            sh -lc '
              set -e
              dnf install -y python3-pip make
              python3 -m pip install --upgrade pip
              python3 -m pip install -e ".[dev,gm]"
              make lint
              make test
              make build
            '

  standard-crypto:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -m "not gm"
