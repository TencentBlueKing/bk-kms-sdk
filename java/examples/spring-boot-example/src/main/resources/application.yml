# -------------------------------------------------------------------
# BK-KMS starter configuration.
# Sensitive values (URL / access key / secret key) are loaded from
# environment variables to avoid leaking secrets in source code:
#   BK_KMS_BASE_URL, BK_KMS_ACCESS_KEY, BK_KMS_SECRET_KEY, BK_KMS_APP_CODE
# -------------------------------------------------------------------
bk:
  kms:
    base-url: "${BK_KMS_BASE_URL:}"
    direct: true
    app-code: "${BK_KMS_APP_CODE:}"
    access-key: "${BK_KMS_ACCESS_KEY:}"
    secret-key: "${BK_KMS_SECRET_KEY:}"
    timeout: 30s
    crypto:
      asymmetric-type: RSA
      symmetric-type: AES
      symmetric-mode: CBC
    placeholder:
      enabled: true

# -------------------------------------------------------------------
# Demo values covering every credential type available in KMS.
# Any KMS:xxx (or KMS:xxx#field) value is transparently resolved on lookup.
# Expected resolved plain-text values:
#   credential_name_2 (SINGLE_PASSWORD)        -> demo-pass-2
#   credential_name_1 (USERNAME_PASSWORD)      -> demo-user-1 / demo-pass-1
#   test-2-sp         (SINGLE_PASSWORD)        -> test-2-pass
#   test-2-sk         (SINGLE_SECRET_KEY)      -> test-2-secret
#   test-2-app        (APP_ID_SECRET_KEY)      -> test-2-appid / test-2-secret
#   test-2-up         (USERNAME_PASSWORD)      -> test-2-user  / test-2-pass-2
# -------------------------------------------------------------------
kms-demo:
  # SINGLE_PASSWORD credentials (no #field needed)
  single-password:
    credential-name-2: "KMS:credential_name_2"
    test-2-sp: "KMS:test-2-sp"
  # SINGLE_SECRET_KEY credentials (no #field needed)
  single-secret-key:
    test-2-sk: "KMS:test-2-sk"
  # USERNAME_PASSWORD credentials (require #username / #password)
  username-password:
    credential-name-1-username: "KMS:credential_name_1#username"
    credential-name-1-password: "KMS:credential_name_1#password"
    test-2-up-username: "KMS:test-2-up#username"
    test-2-up-password: "KMS:test-2-up#password"
  # APP_ID_SECRET_KEY credentials (require #app_id / #secret_key)
  app-id-secret-key:
    test-2-app-app-id: "KMS:test-2-app#app_id"
    test-2-app-secret-key: "KMS:test-2-app#secret_key"

# Any KMS:xxx value is transparently resolved on lookup.
spring:
  datasource:
    # single-field credential form: KMS:{credential_name}
    password: "KMS:demo_credential"
    # multi-field credential form: KMS:{credential_name}#{field}
    # username: "KMS:mysql_cred#username"
    # password: "KMS:mysql_cred#password"
