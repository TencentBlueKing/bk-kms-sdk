[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bk-kms-sdk"
dynamic = ["version"]
description = "Python SDK for BlueKing Key Management Service"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "TencentBlueKing", email = "contactus_bk@tencent.com" },
]
dependencies = [
    "bk-crypto-python-sdk==4.1.1",
    "httpx2>=2.12,<3",
]

[project.optional-dependencies]
django = [
    "Django>=4.2,<6",
]
gm = [
    "bk-crypto-python-sdk[gm]==4.1.1",
]
dev = [
    "build>=1.2,<2",
    "mypy>=1.14,<1.19",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "bk_kms._version.__version__" }

[tool.setuptools.package-data]
bk_kms = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "gm: requires the optional SM2/SM4 backend",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP007", "UP045"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/bk_kms"]
mypy_path = "src"
