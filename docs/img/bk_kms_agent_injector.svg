<text x="35" y="154" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="500">储</text>
<rect x="60" y="90" width="580" height="84" rx="12" fill="#FFFFFF" stroke="#DCE7F4" stroke-width="0.8"/>

