<svg viewBox="0 0 680 648" width="680" height="648" xmlns="http://www.w3.org/2000/svg" role="img">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="680" height="648" fill="#F5F9FE"/>

<!-- 标题区 -->
<g transform="translate(20, 18)">
  <rect x="0" y="0" width="34" height="34" rx="8" fill="#EDF4FB" stroke="#DCE7F4" stroke-width="0.5"/>
  <polygon points="17,7 26,12 26,22 17,27 8,22 8,12" fill="none" stroke="#185FA5" stroke-width="1.3"/>
  <circle cx="17" cy="17" r="3" fill="#185FA5"/>
</g>
<text x="64" y="33" fill="#0C447C" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="500">BK-KMS · ESO 凭证消费方案</text>
<line x1="64" y1="40" x2="294" y2="40" stroke="#378ADD" stroke-width="1.8"/>
<text x="64" y="66" fill="#5F5E5A" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12">ExternalSecret 声明式拉取 · 密文同步为原生 K8S Secret · 环境变量 / 文件双形态注入</text>

<g transform="translate(556, 22)">
  <rect x="0" y="0" width="84" height="24" rx="12" fill="#EAF3DE" stroke="#C6DFA0" stroke-width="0.6"/>
  <text x="42" y="12" text-anchor="middle" dominant-baseline="central" fill="#3F7314" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="500">Secret 消费</text>
</g>

<!-- ================= 凭证存储 ================= -->
<rect x="20" y="90" width="30" height="84" rx="6" fill="#185FA5"/>
<text x="35" y="106" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="500">凭</text>
<text x="35" y="122" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="500">证</text>
<text x="35" y="138" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="500">存</text>
<text x="35" y="154" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="500">储</text>
<rect x="60" y="90" width="580" height="84" rx="12" fill="#FFFFFF" stroke="#DCE7F4" stroke-width="0.8"/>

<rect x="90" y="110" width="500" height="44" rx="10" fill="#EAF3DE" stroke="#97C459" stroke-width="0.8"/>
<text x="112" y="132" fill="#3F7314" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" dominant-baseline="central">OpenBao / Vault</text>
<text x="568" y="126" text-anchor="end" fill="#3F7314" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" dominant-baseline="central">KV v2 · default/my-scope/mysql</text>
<text x="568" y="140" text-anchor="end" fill="#6E8A4E" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" dominant-baseline="central">字段：private_key（私钥） · envelope（密文信封）</text>

<!-- 存储 → 注入层：SA Token 认证 -->
<path d="M340 176 L340 200" fill="none" stroke="#7FA8DC" stroke-width="2" marker-end="url(#arr)"/>
<text x="362" y="188" fill="#5F7C9C" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" dominant-baseline="central">① Kubernetes Auth · SA Token 认证</text>

<!-- ================= 注入层 ================= -->
<rect x="20" y="202" width="30" height="104" rx="6" fill="#185FA5"/>
<text x="35" y="234" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="500">注</text>
<text x="35" y="250" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="500">入</text>
<text x="35" y="266" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="500">层</text>
<rect x="60" y="202" width="580" height="104" rx="12" fill="#FFFFFF" stroke="#DCE7F4" stroke-width="0.8"/>
<text x="76" y="222" fill="#8199B3" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11">ESO（External Secrets Operator） · 集群级 Operator 持续同步与轮转</text>

<!-- SecretStore -->
<rect x="84" y="234" width="180" height="58" rx="10" fill="#EDF4FB" stroke="#8FB8E0" stroke-width="0.9"/>
<text x="174" y="256" text-anchor="middle" fill="#0C447C" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600">SecretStore</text>
<text x="174" y="276" text-anchor="middle" fill="#5F5E5A" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10">OpenBao · app-prod-reader</text>

<!-- ExternalSecret -->
<rect x="284" y="234" width="200" height="58" rx="10" fill="#EDF4FB" stroke="#8FB8E0" stroke-width="0.9"/>
<text x="384" y="256" text-anchor="middle" fill="#0C447C" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600">ExternalSecret</text>
<text x="384" y="276" text-anchor="middle" fill="#5F5E5A" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10">声明拉取凭证 · 周期性同步轮转</text>

<!-- 生成的 Secret -->
<rect x="504" y="234" width="112" height="58" rx="10" fill="#EAF3DE" stroke="#97C459" stroke-width="0.9"/>
<text x="560" y="258" text-anchor="middle" fill="#3F7314" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600">K8S Secret</text>
<text x="560" y="276" text-anchor="middle" fill="#6E8A4E" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5">app-mysql-secret</text>

<!-- 注入层内部连线 -->
<path d="M264 263 L282 263" fill="none" stroke="#7FA8DC" stroke-width="2" marker-end="url(#arr)"/>
<path d="M484 263 L502 263" fill="none" stroke="#7FA8DC" stroke-width="2" marker-end="url(#arr)"/>
<text x="493" y="228" text-anchor="middle" fill="#5F7C9C" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5">②同步</text>

<!-- Secret → 业务 Pod -->
<path d="M560 306 L560 332" fill="none" stroke="#7FA8DC" stroke-width="2" marker-end="url(#arr)"/>
<text x="346" y="319" fill="#5F7C9C" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" dominant-baseline="central">③ 按 secretKeyRef / volume 注入业务容器</text>

<!-- ================= 业务消费层 ================= -->
<rect x="20" y="334" width="30" height="282" rx="6" fill="#185FA5"/>
<text x="35" y="446" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="500">消</text>
<text x="35" y="462" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="500">费</text>
<text x="35" y="478" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="500">层</text>
<rect x="60" y="334" width="580" height="282" rx="12" fill="#FFFFFF" stroke="#DCE7F4" stroke-width="0.8"/>

<!-- 业务 Pod 外框 -->
<rect x="84" y="350" width="532" height="228" rx="12" fill="#F7FBFF" stroke="#8FB8E0" stroke-width="1.1" stroke-dasharray="5 3"/>
<g transform="translate(100, 364)">
  <rect x="0" y="0" width="20" height="20" rx="5" fill="#EDF4FB" stroke="#8FB8E0" stroke-width="0.6"/>
  <polygon points="10,3 16,6.5 16,13.5 10,17 4,13.5 4,6.5" fill="none" stroke="#185FA5" stroke-width="1"/>
</g>
<text x="128" y="378" fill="#0C447C" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600">业务 Pod</text>
<text x="196" y="378" fill="#8199B3" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10">namespace: app-prod · serviceAccountName: app-prod-sa</text>

<!-- 业务容器 app -->
<rect x="104" y="394" width="330" height="168" rx="10" fill="#FFFFFF" stroke="#DCE7F4" stroke-width="0.9"/>
<text x="120" y="414" fill="#0C447C" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600">container: app</text>
<text x="322" y="414" text-anchor="end" fill="#8199B3" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9">app-server:v1.0.0</text>
<line x1="120" y1="422" x2="418" y2="422" stroke="#EDF2F8" stroke-width="1"/>

<!-- env 注入 -->
<rect x="120" y="432" width="298" height="44" rx="8" fill="#FEF6E9" stroke="#EBCB94" stroke-width="0.8"/>
<text x="132" y="448" fill="#9A6B1E" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" dominant-baseline="central">env · 环境变量</text>
<text x="132" y="465" fill="#9A6B1E" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" dominant-baseline="central">MYSQL_PRIVATE_KEY ← secretKeyRef: privateKey</text>

<!-- 文件挂载 -->
<rect x="120" y="484" width="298" height="60" rx="8" fill="#EDF4FB" stroke="#8FB8E0" stroke-width="0.8"/>
<text x="132" y="500" fill="#0C447C" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" dominant-baseline="central">volumeMount · 文件挂载</text>
<text x="132" y="517" fill="#5F5E5A" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" dominant-baseline="central">/etc/secrets/mysql/envelope ← Secret[envelope]</text>
<text x="132" y="532" fill="#8199B3" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" dominant-baseline="central">volume 来源：secret app-mysql-secret</text>

<!-- Secret 卡片（Pod 内） -->
<rect x="456" y="394" width="144" height="168" rx="10" fill="#EAF3DE" stroke="#97C459" stroke-width="1"/>
<text x="528" y="414" text-anchor="middle" fill="#3F7314" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="600">K8S Secret</text>
<text x="528" y="429" text-anchor="middle" fill="#6E8A4E" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9">app-mysql-secret</text>
<line x1="470" y1="438" x2="586" y2="438" stroke="#C6DFA0" stroke-width="1"/>
<rect x="470" y="448" width="116" height="42" rx="7" fill="#FFFFFF" stroke="#C6DFA0" stroke-width="0.7"/>
<text x="528" y="464" text-anchor="middle" fill="#3F7314" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600">privateKey</text>
<text x="528" y="479" text-anchor="middle" fill="#6E8A4E" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5">私钥 → 环境变量</text>
<rect x="470" y="498" width="116" height="42" rx="7" fill="#FFFFFF" stroke="#C6DFA0" stroke-width="0.7"/>
<text x="528" y="514" text-anchor="middle" fill="#3F7314" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600">envelope</text>
<text x="528" y="529" text-anchor="middle" fill="#6E8A4E" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5">密文信封 → 文件</text>

<!-- Secret → 容器内两种消费 -->
<path d="M456 454 L420 454" fill="none" stroke="#8FBF5A" stroke-width="2" marker-end="url(#arr)"/>
<path d="M456 514 L420 514" fill="none" stroke="#8FBF5A" stroke-width="2" marker-end="url(#arr)"/>

<!-- 底部结论条 -->
<text x="128" y="600" fill="#8199B3" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5">运行时：应用读取 env / 文件 → KMS SDK 解密 → 凭证明文</text>
<text x="596" y="600" text-anchor="end" fill="#B07A2E" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9">轮转：文件自动刷新</text>

<text x="350" y="638" text-anchor="middle" fill="#85B7EB" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" letter-spacing="2">BLUEKING · BK-KMS · ESO</text>
</svg>
