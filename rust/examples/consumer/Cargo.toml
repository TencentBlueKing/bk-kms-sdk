# 一个独立的消费者项目，演示如何在其他 Rust 项目中引入并使用 bk-kms-sdk。
#
# 这是独立的 crate（不在 SDK 的 Cargo 包内），请在本目录下单独构建：
# 信封从当前目录的 envelope.txt 读取，私钥内容通过环境变量传入。
#
#     cd examples/consumer
#     # 把 KMS 下发的 Base64 信封写入 envelope.txt
#     $env:BK_KMS_PRIVATE_KEY = '<base64(PEM) 私钥内容>'
#     cargo run
[package]
name = "bk-kms-consumer-example"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# 方式一：本地路径依赖。本示例采用这种方式，无需 SDK 发布即可使用。
bk-kms-sdk = { path = "../.." }

# 方式二：Git 依赖。Cargo 会自动定位仓库 rust/ 子目录中的 crate，
# 生产环境建议用 rev 锁定提交，避免上游变更导致构建漂移。
# bk-kms-sdk = { git = "https://github.com/TencentBlueKing/bk-kms-sdk", rev = "<commit>" }

# 方式三：SDK 发布到 crates.io 之后。
# bk-kms-sdk = "1.0"

serde_json = "1.0"
